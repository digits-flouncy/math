<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>다리가 몇 개?</title>
<link rel="stylesheet" href="../../shared/tamheom.css?v=11" />
<style>
  .pens { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .pen {
    width: 200px; border-radius: 20px; padding: 8px 10px; text-align: center;
    border: 3px solid #e7b3b3; background: #fff6f6;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .pen.duck { border-color: #a9cbe8; background: #f3f8fd; }
  .pen-title { font-weight: 800; font-size: 1.05rem; }
  .pen-title small { display: block; font-size: 0.9rem; color: var(--ink-soft); }
  .pen-animals { font-size: 1.1rem; line-height: 1.3; word-break: break-all; }
  .pen-count { font-size: 2rem; font-weight: 900; }
  .total {
    margin: 10px auto 0; text-align: center; background: #fff8e1; border: 3px solid #f0c35a;
    border-radius: 18px; padding: 4px 20px; width: fit-content; font-weight: 700;
  }
  .total b { font-size: 2rem; color: #b86a00; }
  .steps { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .step { border: 2px solid var(--line); border-radius: 16px; padding: 6px 12px; opacity: 0.45; }
  .step .th-slot-sm { height: 50px; }
  .step.is-now { opacity: 1; border-color: var(--accent); background: var(--accent-soft); }
  .step.is-done { opacity: 1; }
  .step-label { font-weight: 800; color: var(--accent); margin-bottom: 4px; }
  .legs-q { font-size: 1.6rem; margin-bottom: 8px; }
  .calc { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 1.5rem; font-weight: 800; }
  .step-help { font-size: 1rem; color: var(--retry); margin-top: 6px; }
</style>
</head>
<body>
<script src="../../shared/tamheom.js?v=11"></script>
<script>
(function () {
  const T = Tamheom;
  const { randInt, pick, h } = T;
  const A = {
    pig:  { name: '돼지', emoji: '🐷', legs: 4 },
    duck: { name: '오리', emoji: '🦆', legs: 2 }
  };
  const RANGE = [null, { pig: [2, 5], duck: [2, 6] }, { pig: [2, 9], duck: [2, 12] }, { pig: [3, 15], duck: [3, 20] }];

  function makeProblem(level) {
    const r = RANGE[level];
    return { pig: randInt(r.pig[0], r.pig[1]), duck: randInt(r.duck[0], r.duck[1]), hide: pick(['pig', 'duck']) };
  }

  T.activity({
    id: 'animal-legs',
    title: '다리가 몇 개?',
    emoji: '🐷',
    subtitle: '전체 다리 수를 보고 모르는 동물이 몇 마리인지 찾아요',
    accent: '#2f6f9f',
    accentSoft: '#e7f1fa',
    levels: [
      { name: '단계 따라 풀기 + 도움 숫자', desc: '작은 수. 풀이 3단계를 하나씩, 첫 단계 숫자는 미리 써 있어요.' },
      { name: '단계 따라 풀기',             desc: '풀이 3단계를 하나씩 직접 채워요.' },
      { name: '바로 답 쓰기',               desc: '큰 수. 답만 써요. 틀리면 풀이 단계가 나와요.' }
    ],

    intro(el) {
      el.innerHTML = `
        <p>🐷 돼지 1마리는 다리 <b>4개</b>, 🦆 오리 1마리는 다리 <b>2개</b>예요.</p>
        <p style="margin-top:8px">예) 돼지 3마리, 오리는 몇 마리? 전체 다리는 <b>20개</b>.</p>
        <ol class="steps" style="list-style:none">
          <li class="step is-done"><div class="step-label">① 아는 동물의 다리 수</div>3 × 4 = <b>12</b>개</li>
          <li class="step is-done"><div class="step-label">② 모르는 동물의 다리 수</div>20 − 12 = <b>8</b>개</li>
          <li class="step is-done"><div class="step-label">③ 몇 마리?</div>8 ÷ 2 = <b>4</b>마리 → 오리는 4마리!</li>
        </ol>`;
    },

    question(el, ctx) {
      const p = ctx.review || makeProblem(ctx.level);
      ctx.setData(p);
      const hid = A[p.hide], known = A[p.hide === 'pig' ? 'duck' : 'pig'];
      const knownCount = p.hide === 'pig' ? p.duck : p.pig;
      const answer = p.hide === 'pig' ? p.pig : p.duck;
      const total = p.pig * 4 + p.duck * 2;
      const knownLegs = knownCount * known.legs;
      const hidLegs = total - knownLegs;

      const cols = h('div', 'th-cols');
      const left = h('div');
      const right = h('div', 'th-answer-col');
      cols.appendChild(left); cols.appendChild(right);
      el.appendChild(cols);

      left.appendChild(h('div', 'th-question legs-q', `${hid.emoji} ${hid.name}는 몇 마리일까요?`));

      // 우리
      const pens = h('div', 'pens');
      const finalSlot = T.slot({ max: 2, label: `${hid.name} 마리 수` });
      ['pig', 'duck'].forEach(k => {
        const a = A[k];
        const pen = h('div', 'pen ' + k);
        pen.appendChild(h('div', 'pen-title', `${a.emoji} ${a.name} 우리<small>1마리 = 다리 ${a.legs}개</small>`));
        if (k === p.hide) {
          const row = h('div');
          row.appendChild(finalSlot.el);
          row.appendChild(h('span', 'unit', ' 마리'));
          pen.appendChild(row);
        } else {
          const c = k === 'pig' ? p.pig : p.duck;
          pen.appendChild(h('div', 'pen-animals', c <= 12 ? a.emoji.repeat(c) : ''));
          pen.appendChild(h('div', 'pen-count', `${c}마리`));
        }
        pens.appendChild(pen);
      });
      left.appendChild(pens);
      left.appendChild(h('div', 'total', `전체 다리 수 <b>${total}</b>개`));

      // 풀이 단계 (과제 분석)
      const stepsBox = h('div', 'steps');
      left.appendChild(stepsBox);
      const pre = ctx.level === 1;
      const s1a = T.slot({ small: true, value: pre ? knownCount : null }), s1b = T.slot({ small: true, value: pre ? known.legs : null }), s1c = T.slot({ small: true, max: 3 });
      const s2b = T.slot({ small: true, max: 3 }), s2c = T.slot({ small: true, max: 3 });
      const s3a = T.slot({ small: true, max: 3 }), s3b = T.slot({ small: true }), s3c = T.slot({ small: true });
      if (pre) { s1a.lock(); s1b.lock(); }

      const steps = [
        { label: `① ${known.emoji} ${known.name}의 다리 수`, parts: [s1a, '×', s1b, '=', s1c, '개'], slots: pre ? [s1c] : [s1a, s1b, s1c],
          ok: () => ((s1a.number === knownCount && s1b.number === known.legs) || (s1a.number === known.legs && s1b.number === knownCount)) && s1c.number === knownLegs,
          help: `${known.name} ${knownCount}마리 × 다리 ${known.legs}개 = ${knownLegs}개` },
        { label: `② ${hid.emoji} ${hid.name}의 다리 수`, parts: [`<span class="th-fixed-num">${total}</span>`, '−', s2b, '=', s2c, '개'], slots: [s2b, s2c],
          ok: () => s2b.number === knownLegs && s2c.number === hidLegs,
          help: `${total} − ${knownLegs} = ${hidLegs}` },
        { label: `③ ${hid.emoji} ${hid.name}는 몇 마리?`, parts: [s3a, '÷', s3b, '=', s3c, '마리'], slots: [s3a, s3b, s3c],
          ok: () => s3a.number === hidLegs && s3b.number === hid.legs && s3c.number === answer,
          help: `${hid.name} 다리 ${hidLegs}개 ÷ 한 마리 다리 ${hid.legs}개 = ${answer}마리` }
      ];
      steps.forEach(st => {
        const box = h('div', 'step');
        box.appendChild(h('div', 'step-label', st.label));
        const calc = h('div', 'calc');
        st.parts.forEach(x => {
          if (typeof x === 'string') calc.appendChild(h('span', '', x));
          else calc.appendChild(x.el);
        });
        box.appendChild(calc);
        st.helpEl = h('div', 'step-help');
        box.appendChild(st.helpEl);
        st.box = box;
        st.wrongs = 0;
        stepsBox.appendChild(box);
      });

      let mode = ctx.level <= 2 ? 'steps' : 'direct';
      let cur = 0;
      const pad = T.keypad({ slots: [], onCheck: check });
      right.appendChild(pad.el);

      function enterSteps() {
        mode = 'steps';
        stepsBox.hidden = false;
        finalSlot.clear();
        finalSlot.mark(null);
        finalSlot.el.classList.remove('is-open', 'is-active');
        focusStep();
      }
      function focusStep() {
        steps.forEach((st, i) => {
          st.box.classList.toggle('is-now', i === cur);
          st.box.classList.toggle('is-done', i < cur);
        });
        pad.setSlots(steps[cur].slots);
      }

      if (mode === 'steps') enterSteps();
      else { stepsBox.hidden = true; pad.setSlots([finalSlot]); }

      function check() {
        if (mode === 'direct') {
          if (finalSlot.value === '') { ctx.say('빈칸에 숫자를 써 보자', 'info'); return; }
          if (finalSlot.number === answer) { finalSlot.mark('right'); finalSlot.lock(); ctx.correct('다리 수로 잘 찾았어!'); return; }
          finalSlot.mark('wrong');
          ctx.wrong('괜찮아, 풀이 단계를 따라 같이 해 보자 🐸');
          enterSteps();
          return;
        }
        const st = steps[cur];
        if (st.slots.some(s => s.value === '')) { ctx.say('빈칸에 숫자를 써 보자', 'info'); return; }
        if (st.ok()) {
          st.slots.forEach(s => { s.mark('right'); s.lock(); });
          st.helpEl.textContent = '';
          if (cur < steps.length - 1) {
            cur += 1;
            ctx.say('좋아! 다음 단계로 가 보자', 'info');
            focusStep();
          } else {
            finalSlot.set(answer); finalSlot.mark('right'); finalSlot.lock();
            steps.forEach(x => x.box.classList.add('is-done'));
            ctx.correct('단계를 차근차근 잘 풀었어!');
          }
          return;
        }
        st.slots.forEach(s => s.mark('wrong'));
        st.wrongs += 1;
        ctx.wrong();
        if (st.wrongs >= 2) st.helpEl.textContent = '도움: ' + st.help;
        pad.setSlots(st.slots);
      }
    }
  });
})();
</script>
</body>
</html>
