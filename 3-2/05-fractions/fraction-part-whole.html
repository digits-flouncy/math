<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>분수 퀴즈 - 묶어서 알아보기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Nanum Gothic', sans-serif;
    background: #f4f8f4;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px 24px;
    color: #333;
  }

  h1 {
    font-size: 1.4rem;
    color: #3a7d5c;
    margin-bottom: 2px;
    text-align: center;
  }
  .subtitle {
    font-size: 0.85rem;
    color: #7a8a80;
    margin-bottom: 8px;
    text-align: center;
  }

  /* 진행 표시 */
  .progress-wrap {
    width: 100%;
    max-width: 700px;
    margin-bottom: 10px;
  }
  .progress-label {
    font-size: 0.85rem;
    font-weight: bold;
    color: #5a8a6a;
    text-align: center;
    margin-bottom: 4px;
  }
  .progress-bar-bg {
    width: 100%;
    height: 10px;
    background: #dfe8e0;
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: #7fb88a;
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  /* 카드: 넓은 태블릿 화면을 위해 가로 2단 구성 */
  .card {
    background: #fff;
    border: 3px solid #cfe3d4;
    border-radius: 22px;
    padding: 16px 28px;
    width: 100%;
    max-width: 1020px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.06);
  }

  .content-row {
    display: flex;
    gap: 28px;
    align-items: stretch;
  }
  .left-col {
    flex: 1 1 58%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .right-col {
    flex: 1 1 42%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-left: 2px dashed #dfe8e0;
    padding-left: 28px;
  }

  .question-text {
    font-size: 2.2rem;
    font-weight: bold;
    color: #3a5a45;
    line-height: 1.4;
    margin-bottom: 10px;
    text-align: center;
  }
  .question-text .hi { color: #3a7d5c; }

  /* 묶음 힌트 문구 */
  .group-hint {
    font-size: 0.85rem;
    color: #5a8a6a;
    background: #eef6ef;
    border-radius: 10px;
    padding: 6px 14px;
    margin-bottom: 10px;
    text-align: center;
    line-height: 1.5;
  }
  .group-hint b { color: #3a7d5c; }

  /* 묶음(우리) 배치: 개수에 따라 열 수를 동적으로 지정 */
  .pen-wrap {
    display: grid;
    gap: 10px;
    justify-content: center;
    align-content: center;
    max-width: 560px;
  }
  .pen {
    display: grid;
    gap: 4px;
    align-content: center;
    justify-content: center;
    min-width: 64px;
    min-height: 64px;
    border-radius: 14px;
    padding: 8px;
    background: #eef6ef;
    border: 3px solid #bcdcc4;
    transition: background 0.2s, border-color 0.2s;
  }
  .pen.dim {
    background: #eee;
    border-color: #d6d6d6;
  }
  .pen .frog {
    font-size: 1.5rem;
    line-height: 1;
    text-align: center;
  }
  .pen.dim .frog {
    opacity: 0.3;
    filter: grayscale(1);
  }

  /* 분수 입력 */
  .frac-input-row {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 14px;
  }
  .frac-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .frac-box input {
    width: 82px;
    height: 72px;
    font-size: 2rem;
    font-weight: 900;
    text-align: center;
    border-radius: 14px;
    border: 3px solid #bcdcc4;
    outline: none;
    color: #3a7d5c;
    background: #fbfffc;
    -moz-appearance: textfield;
  }
  .frac-box input::-webkit-outer-spin-button,
  .frac-box input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .frac-box input:focus { border-color: #5a9d6c; }
  .frac-box input.ok { background: #d9f2df; border-color: #4a9d5c; color: #2e6b3e; }
  .frac-box input.ng { background: #fdeceb; border-color: #d98a80; color: #a8443a; }
  .frac-line {
    width: 76px;
    height: 4px;
    background: #6a9a78;
    border-radius: 2px;
  }

  /* 버튼 */
  .btn-row { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 260px; }
  button {
    font-size: 1.05rem;
    font-weight: bold;
    padding: 16px;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    transition: transform 0.15s, background 0.2s;
  }
  button:active { transform: scale(0.97); }
  #btn-check { background: #5a9d6c; color: white; }
  #btn-check:hover { background: #4a8a5c; }
  #btn-next {
    background: #a9c8b0; color: white;
    display: none;
  }
  #btn-next:hover { background: #8fb598; }

  .feedback {
    min-height: 2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    font-weight: bold;
    margin-bottom: 8px;
  }
  .feedback.correct { color: #3a7d5c; }
  .feedback.wrong   { color: #a8574a; }

  .nav-bottom { margin-top: 10px; }
  .nav-bottom a {
    font-size: 0.85rem;
    color: #7a8a80;
    text-decoration: none;
    padding: 6px 14px;
    border: 2px solid #dfe8e0;
    border-radius: 12px;
  }
  .nav-bottom a:hover { background: #eef6ef; }

  #confetti-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 999;
  }
</style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>

  <h1>🐸 분수 퀴즈</h1>
  <p class="subtitle">개구리를 묶어서 몇분의 몇인지 알아봐요</p>

  <div class="progress-wrap">
    <div class="progress-label" id="progress-label">문제 1 / 20</div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-fill" style="width:5%"></div>
    </div>
  </div>

  <div class="card">
    <div class="content-row">

      <div class="left-col">
        <div class="question-text" id="question-text"></div>
        <div class="group-hint" id="group-hint"></div>
        <div class="pen-wrap" id="pen-wrap"></div>
      </div>

      <div class="right-col">
        <div class="frac-input-row">
          <div class="frac-box">
            <input type="number" id="num-input" min="0" placeholder="" />
            <div class="frac-line"></div>
            <input type="number" id="den-input" min="0" placeholder="" />
          </div>
        </div>

        <div class="feedback" id="feedback"></div>

        <div class="btn-row">
          <button id="btn-check" onclick="checkAnswer()">정답 확인 🎯</button>
          <button id="btn-next" onclick="nextQuestion()">다음 문제 ➡️</button>
        </div>
      </div>

    </div>
  </div>

  <div class="nav-bottom">
    <a href="../../index.html">🏠 처음으로</a>
  </div>

<script>
  const TOTAL_QUESTIONS = 20;
  // 그룹 수(분모)와 한 묶음당 개수로 쓸 수 있는 값들
  const GROUP_CHOICES = [3, 4, 5, 6, 7, 8];      // 분모 d (2는 항상 1/2가 되어 너무 쉬우므로 제외)
  const SIZE_CHOICES  = [2, 3, 4, 6, 8];         // 한 묶음당 마리 수 s
  const MAX_TOTAL     = 24;                      // 전체 마리 수 상한

  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function pick(arr) { return arr[randInt(0, arr.length - 1)]; }

  // 개수에 따라 보기 좋은 열x행 배치를 계산 (6 -> 3x2, 8 -> 4x2 등)
  function gridDims(c) {
    if (c <= 1) return { cols: 1, rows: 1 };
    if (c % 2 === 0) return { cols: c / 2, rows: 2 };
    return { cols: c, rows: 1 };
  }

  function makeProblem() {
    let d, s, total, tries = 0;
    do {
      d = pick(GROUP_CHOICES);
      s = pick(SIZE_CHOICES);
      total = d * s;
      tries++;
    } while (total > MAX_TOTAL && tries < 200);
    const n = randInt(2, d - 1);   // 분자: 선택된 묶음 수 (1은 너무 쉬우므로 2 이상에서 선택)
    const part = n * s;
    return { d, s, total, n, part };
  }

  let problems = [];
  for (let i = 0; i < TOTAL_QUESTIONS; i++) problems.push(makeProblem());

  let current = 0;
  let solved = false;

  function renderPens(p) {
    const wrap = document.getElementById('pen-wrap');
    wrap.innerHTML = '';

    const outer = gridDims(p.d);
    wrap.style.gridTemplateColumns = `repeat(${outer.cols}, auto)`;

    const inner = gridDims(p.s);

    for (let g = 0; g < p.d; g++) {
      const pen = document.createElement('div');
      pen.className = 'pen' + (g < p.n ? '' : ' dim');
      pen.style.gridTemplateColumns = `repeat(${inner.cols}, 1fr)`;
      for (let i = 0; i < p.s; i++) {
        const frog = document.createElement('span');
        frog.className = 'frog';
        frog.textContent = '🐸';
        pen.appendChild(frog);
      }
      wrap.appendChild(pen);
    }
  }

  function loadQuestion() {
    const p = problems[current];
    solved = false;

    document.getElementById('progress-label').textContent =
      `문제 ${current + 1} / ${problems.length}`;
    document.getElementById('progress-fill').style.width =
      `${((current + 1) / problems.length) * 100}%`;

    document.getElementById('question-text').innerHTML =
      `<span class="hi">${p.part}</span>은 <span class="hi">${p.total}</span>의 몇분의 몇일까요?`;

    document.getElementById('group-hint').innerHTML =
      `${p.total}마리를 <b>${p.s}마리씩</b> 묶으면 모두 <b>${p.d}묶음</b>이 돼요.`;

    renderPens(p);

    const numInput = document.getElementById('num-input');
    const denInput = document.getElementById('den-input');
    numInput.value = '';
    denInput.value = '';
    numInput.className = '';
    denInput.className = '';

    document.getElementById('feedback').textContent = '';
    document.getElementById('feedback').className = 'feedback';

    document.getElementById('btn-check').style.display = 'block';
    document.getElementById('btn-next').style.display = 'none';
  }

  // 정답을 맞히면 화면에 부드러운 색종이 효과를 살짝 보여줌 (버튼 클릭 시에만 실행)
  const confettiCanvas = document.getElementById('confetti-canvas');
  const confettiCtx = confettiCanvas.getContext('2d');
  const confettiColors = ['#a8dab5', '#f4c9a8', '#a8c8e8', '#c9b8e8', '#f5e2a8'];

  function resizeConfettiCanvas() {
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
  }
  resizeConfettiCanvas();
  window.addEventListener('resize', resizeConfettiCanvas);

  function launchConfetti() {
    const pieces = [];
    const count = 60;
    for (let i = 0; i < count; i++) {
      pieces.push({
        x: Math.random() * confettiCanvas.width,
        y: -20 - Math.random() * 100,
        size: 6 + Math.random() * 6,
        color: confettiColors[Math.floor(Math.random() * confettiColors.length)],
        speedY: 2 + Math.random() * 2.5,
        speedX: (Math.random() - 0.5) * 1.5,
        rotation: Math.random() * Math.PI,
        rotSpeed: (Math.random() - 0.5) * 0.15
      });
    }

    const duration = 1600;
    const start = performance.now();

    function frame(now) {
      const elapsed = now - start;
      confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

      const fadeOut = elapsed > duration - 400 ? Math.max(0, (duration - elapsed) / 400) : 1;

      pieces.forEach(p => {
        p.x += p.speedX;
        p.y += p.speedY;
        p.rotation += p.rotSpeed;

        confettiCtx.save();
        confettiCtx.globalAlpha = fadeOut;
        confettiCtx.translate(p.x, p.y);
        confettiCtx.rotate(p.rotation);
        confettiCtx.fillStyle = p.color;
        confettiCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
        confettiCtx.restore();
      });

      if (elapsed < duration) {
        requestAnimationFrame(frame);
      } else {
        confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      }
    }
    requestAnimationFrame(frame);
  }

  // 정답(n/d)과 정확히 같거나, 수학적으로 같은 분수도 정답으로 인정
  function isCorrectFraction(num, den, n, d) {
    if (den === 0) return false;
    return num * d === den * n;
  }

  function checkAnswer() {
    if (solved) return;
    const p = problems[current];
    const numInput = document.getElementById('num-input');
    const denInput = document.getElementById('den-input');
    const num = parseInt(numInput.value);
    const den = parseInt(denInput.value);
    const feedback = document.getElementById('feedback');

    if (isNaN(num) || isNaN(den)) {
      feedback.textContent = '숫자를 모두 입력해 주세요!';
      feedback.className = 'feedback wrong';
      return;
    }

    if (isCorrectFraction(num, den, p.n, p.d)) {
      numInput.className = 'ok';
      denInput.className = 'ok';
      feedback.textContent = '잘했어요! ⭐';
      feedback.className = 'feedback correct';
      solved = true;
      launchConfetti();
      document.getElementById('btn-check').style.display = 'none';
      document.getElementById('btn-next').style.display =
        (current < problems.length - 1) ? 'block' : 'none';
      if (current === problems.length - 1) {
        feedback.textContent = '잘했어요! 모든 문제를 다 풀었어요 ⭐🎉';
      }
    } else {
      numInput.className = 'ng';
      denInput.className = 'ng';
      feedback.textContent = '다시 해보자 ❤️';
      feedback.className = 'feedback wrong';
    }
  }

  function nextQuestion() {
    if (current < problems.length - 1) {
      current++;
      loadQuestion();
    }
  }

  loadQuestion();
</script>
</body>
</html>
