<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>개구리 묶음 분수</title>
<link rel="stylesheet" href="../../shared/tamheom.css?v=4" />
<style>
  .pens { display: grid; gap: 10px; justify-content: center; }
  .pen {
    display: grid; gap: 4px; justify-content: center; align-content: center;
    padding: 8px; border-radius: 16px; background: var(--accent-soft); border: 3px solid #b5d8bd;
  }
  .pen.dim { background: #f0f0ee; border-color: #dcdcd8; }
  .pen.dim .frog { opacity: 0.35; filter: grayscale(1); }
  .pen.pick { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .loose { display: grid; gap: 6px; justify-content: center; }
  .loose .frog.dim { opacity: 0.35; filter: grayscale(1); }
  .frog { line-height: 1; text-align: center; }
  .steps { margin-top: 10px; font-size: 1.15rem; line-height: 1.8; text-align: left; }
  .steps li { list-style: none; }
  .intro-ex { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center; }
  @media (max-width: 760px) { .intro-ex { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<script src="../../shared/tamheom.js?v=4"></script>
<script>
(function () {
  const T = Tamheom;
  const { randInt, pick, h } = T;

  // 레벨별 문제 범위 (문제 수준은 일반 3학년과 같게)
  const RANGE = [
    null,
    { d: [3, 4, 5],          s: [2, 3],          max: 15 },
    { d: [3, 4, 5, 6, 7],    s: [2, 3, 4],       max: 28 },
    { d: [3, 4, 5, 6, 7, 8], s: [2, 3, 4, 5, 6], max: 42 }
  ];

  function makeProblem(level, type) {
    const r = RANGE[level];
    let d, s, tries = 0;
    do { d = pick(r.d); s = pick(r.s); tries++; } while (d * s > r.max && tries < 200);
    const n = level === 1 ? randInt(1, d - 1) : randInt(Math.min(2, d - 1), d - 1);
    return { t: type, d, s, n };
  }

  // 개수에 따라 보기 좋은 배치 (6 → 3×2, 8 → 4×2 ...)
  function dims(c) {
    if (c <= 3) return { cols: c };
    if (c % 2 === 0) return { cols: c / 2 };
    return { cols: Math.ceil(c / 2) };
  }

  // mode: 'grouped' 묶음 / 'loose' 낱개 / 'none'
  function drawFrogs(p, mode, highlight) {
    const total = p.d * p.s;
    const size = total <= 16 ? '1.8rem' : total <= 28 ? '1.45rem' : '1.2rem';
    if (mode === 'grouped') {
      const wrap = h('div', 'pens');
      wrap.style.gridTemplateColumns = `repeat(${dims(p.d).cols}, auto)`;
      for (let g = 0; g < p.d; g++) {
        let cls = 'pen';
        if (highlight === 'part' && g >= p.n) cls += ' dim';
        if (highlight === 'pick' && g < p.n) cls += ' pick';
        const pen = h('div', cls);
        pen.style.gridTemplateColumns = `repeat(${dims(p.s).cols}, auto)`;
        for (let i = 0; i < p.s; i++) {
          const f = h('span', 'frog', '🐸');
          f.style.fontSize = size;
          pen.appendChild(f);
        }
        wrap.appendChild(pen);
      }
      return wrap;
    }
    const wrap = h('div', 'loose');
    wrap.style.gridTemplateColumns = `repeat(${Math.min(total, 10)}, auto)`;
    for (let i = 0; i < total; i++) {
      const f = h('span', 'frog' + (highlight === 'part' && i >= p.n * p.s ? ' dim' : ''), '🐸');
      f.style.fontSize = size;
      wrap.appendChild(f);
    }
    return wrap;
  }

  const { josa, fracHTML, fracJosa } = T;
  const hi = s => `<span class="hi">${s}</span>`;

  function questionHTML(p) {
    const total = p.d * p.s, part = p.n * p.s;
    if (p.t === 'what') {
      return `${hi(josa(total, '을', '를'))} ${hi(p.s)}씩 묶으면<br>` +
             `${hi(josa(part, '은', '는'))} ${hi(total)}의 몇분의 몇일까요?`;
    }
    return `${hi(total)}의 ${hi(fracJosa(p.n, p.d, '은', '는'))} 얼마일까요?`;
  }

  function hintHTML(p) {
    const total = p.d * p.s, part = p.n * p.s;
    if (p.t === 'what') {
      return `${total}마리를 <b>${p.s}마리씩</b> 묶으면 <b>${p.d}묶음</b>.<br>${part}마리는 그중 <b>${p.n}묶음</b>이에요.`;
    }
    return `${total}마리를 똑같이 <b>${p.d}묶음</b>으로 나누면<br>한 묶음은 <b>${p.s}마리</b>예요.`;
  }

  function stepsHTML(p) {
    const total = p.d * p.s, part = p.n * p.s;
    if (p.t === 'what') {
      return `<ol class="steps">
        <li>① ${p.s}마리씩 묶으면 모두 <b>${p.d}묶음</b></li>
        <li>② ${part}마리는 <b>${p.n}묶음</b></li>
        <li>③ ${p.d}묶음 중 ${p.n}묶음 → <b>${fracHTML(p.n, p.d)}</b></li></ol>`;
    }
    return `<ol class="steps">
      <li>① ${total}마리를 ${p.d}묶음으로 나누면 한 묶음에 <b>${p.s}마리</b></li>
      <li>② ${fracJosa(p.n, p.d, '은', '는')} <b>${p.n}묶음</b></li>
      <li>③ ${p.s}마리씩 ${p.n}묶음 → <b>${part}마리</b></li></ol>`;
  }

  T.activity({
    id: 'frog-fraction',
    title: '개구리 묶음 분수',
    emoji: '🐸',
    subtitle: '개구리를 묶어서 몇분의 몇인지 알아봐요',
    levels: [
      { name: '묶음 그림 + 힌트', desc: '개구리가 묶여 있고 힌트 글이 보여요. 작은 수.' },
      { name: '낱개 그림',         desc: '개구리가 낱개로 있어요. 잠시 뒤 묶음 힌트가 나와요.' },
      { name: '숫자만',            desc: '그림 없이 숫자만. 틀리면 그림이 나와요.' }
    ],
    options: [{
      key: 'type', label: '문제 종류', value: 'what',
      choices: [
        { value: 'what', label: '몇분의 몇? (4는 14의 2/7)' },
        { value: 'many', label: '얼마? (14의 2/7은 4)' },
        { value: 'mix',  label: '섞어서' }
      ],
      note: '처음에는 한 종류만, 익숙해지면(바로 맞히기 80% 이상) 섞어서를 권해요.'
    }],

    intro(el, ctx) {
      const type = ctx.options.type;
      const ex = { t: type === 'many' ? 'many' : 'what', d: 7, s: 2, n: 2 };
      const box = h('div', 'intro-ex');
      box.appendChild(drawFrogs(ex, 'grouped', ex.t === 'what' ? 'part' : 'pick'));
      const text = h('div');
      text.innerHTML = `<p class="th-question" style="text-align:left;font-size:1.4rem">${questionHTML(ex)}</p>` + stepsHTML(ex) +
        (type === 'mix' ? `<p style="margin-top:10px">“14의 ${fracHTML(2, 7)}는 얼마?” 문제도 나와요. 똑같이 묶어서 세면 돼요!</p>` : '');
      box.appendChild(text);
      el.appendChild(box);
    },

    question(el, ctx) {
      let type = ctx.options.type;
      if (type === 'mix') type = pick(['what', 'many']);
      const p = ctx.review || makeProblem(ctx.level, type);
      ctx.setData(p);

      const cols = h('div', 'th-cols');
      const left = h('div', 'th-visual');
      const right = h('div', 'th-answer-col');
      cols.appendChild(left); cols.appendChild(right);
      el.appendChild(cols);

      left.appendChild(h('div', 'th-question', questionHTML(p)));
      const pic = h('div');
      const hint = h('div', 'th-hint', hintHTML(p));
      left.appendChild(pic);
      left.appendChild(hint);
      const steps = h('div');
      left.appendChild(steps);

      const hl = p.t === 'what' ? 'part' : null;
      function showGrouped(strong) {
        pic.innerHTML = '';
        pic.appendChild(drawFrogs(p, 'grouped', strong ? (p.t === 'what' ? 'part' : 'pick') : hl));
        hint.hidden = false;
      }

      if (ctx.level === 1) { showGrouped(true); }
      else if (ctx.level === 2) {
        pic.appendChild(drawFrogs(p, 'loose', hl));
        hint.hidden = true;
        ctx.later(() => showGrouped(false));
      } else {
        hint.hidden = true;
      }

      // 답 칸
      let slots;
      const ansRow = h('div');
      if (p.t === 'what') {
        const f = T.fraction();
        ansRow.appendChild(f.el);
        slots = f.slots;
      } else {
        const s = T.slot({ max: 2, label: '답' });
        ansRow.appendChild(s.el);
        ansRow.appendChild(h('span', 'unit', '마리'));
        slots = [s];
      }
      right.appendChild(ansRow);

      const pad = T.keypad({ slots, onCheck: check });
      right.appendChild(pad.el);

      function check() {
        if (slots.some(s => s.value === '')) { ctx.say('빈칸에 숫자를 써 보자', 'info'); return; }
        let ok;
        if (p.t === 'what') {
          const num = slots[0].number, den = slots[1].number;
          ok = den > 0 && num > 0 && num * p.d === den * p.n;
        } else {
          ok = slots[0].number === p.n * p.s;
        }
        if (ok) {
          slots.forEach(s => { s.mark('right'); s.lock(); });
          showGrouped(true);
          ctx.correct(p.t === 'what' ? '묶음을 잘 셌어!' : '몇 마리인지 잘 찾았어!');
        } else {
          slots.forEach(s => s.mark('wrong'));
          const n = ctx.wrong();
          showGrouped(n >= 2);
          if (n >= 2) steps.innerHTML = stepsHTML(p);
          pad.setSlots(slots);
        }
      }
    }
  });
})();
</script>
</body>
</html>
