<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>분수 피자</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nanum Gothic', sans-serif;
    text-align: center;
    padding: 24px;
    background: #fffaf0;
    min-height: 100vh;
  }

  h1 { color: #e85d04; font-size: 2rem; margin-bottom: 8px; }

  .setting-area {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #fff3e0;
    border: 2px solid #f4a261;
    border-radius: 16px;
    padding: 10px 20px;
    margin: 12px 0 4px;
    font-size: 1.05rem;
    font-weight: bold;
  }
  .setting-area label { color: #c35a00; }
  .setting-area input[type="number"] {
    width: 64px;
    font-size: 1.1rem;
    font-weight: bold;
    text-align: center;
    border: 2px solid #f4a261;
    border-radius: 10px;
    padding: 4px 6px;
    background: #fff;
    color: #c35a00;
    outline: none;
  }
  .setting-area input[type="number"]:focus { border-color: #e85d04; }

  .desc {
    font-size: 1.1rem;
    color: #555;
    margin: 10px 0 4px;
  }
  .desc span { color: #e85d04; font-weight: bold; }

  .pizza-wrap {
    width: 220px;
    height: 220px;
    margin: 16px auto;
  }

  /* 분수 표현 - 위치 절대 고정 */
  .fraction-display {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin: 16px 0;
  }

  .frac {
    display: flex;
    flex-direction: column;
    align-items: center;
    /* 너비 고정: 숫자가 바뀌어도 레이아웃 안 흔들림 */
    width: 80px;
  }
  /* 분자/분모 컨테이너: 고정 높이+너비로 숫자 중앙 고정 */
  .frac-num-wrap,
  .frac-den-wrap {
    width: 80px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: visible;
  }
  .frac-num {
    font-size: 3rem;
    font-weight: 900;
    color: #e85d04;
    line-height: 1;
    display: block;
  }
  .frac-den {
    font-size: 3rem;
    font-weight: 900;
    color: #1566b8;
    line-height: 1;
    display: block;
  }
  .frac-line {
    width: 72px;
    height: 4px;
    background: #333;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .eq-sign {
    font-size: 3rem;
    font-weight: bold;
    color: #555;
    line-height: 1;
  }

  .result-wrap {
    width: 60px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
  }
  .result-num {
    font-size: 3rem;
    font-weight: 900;
    color: #aaa;
    line-height: 1;
    transition: color 0.3s;
  }
  .result-num.known { color: #2e8c1a; }

  /* 애니메이션: scale 대신 opacity flash (위치 안 흔들림) */
  @keyframes flash {
    0%   { opacity: 1; }
    30%  { opacity: 0.2; }
    100% { opacity: 1; }
  }
  .flash { animation: flash 0.3s ease; }

  /* 완성 메시지 분수 형태 */
  .msg {
    min-height: 3.5rem;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-weight: bold;
    color: #2e8c1a;
  }
  .msg-frac {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    line-height: 1;
  }
  .msg-frac-num, .msg-frac-den {
    font-size: 1.4rem;
    font-weight: 900;
    color: #2e8c1a;
  }
  .msg-frac-line {
    height: 3px;
    background: #2e8c1a;
    border-radius: 2px;
    margin: 3px 0;
    width: 28px;
  }

  /* 버튼 */
  .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button {
    font-size: 1.05rem;
    font-weight: bold;
    padding: 12px 20px;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.2s;
  }
  button:active { transform: scale(0.95); }
  #btn-add    { background: #e85d04; color: white; }
  #btn-remove { background: #1566b8; color: white; }
  #btn-reset  { background: #888;    color: white; }
  #btn-add:disabled,
  #btn-remove:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
</style>
</head>
<body>

  <h1>🍕 분수 탐험</h1>

  <div class="setting-area">
    <label for="total-input">전체 조각 수:</label>
    <input type="number" id="total-input" min="1" max="12" value="3" />
    <span style="color:#888;font-size:0.9rem">조각</span>
  </div>

  <p class="desc">
    피자를 <span id="desc-total">3</span>조각으로 나눴어요. 버튼을 눌러 조각을 채워 보세요!
  </p>

  <div class="pizza-wrap">
    <canvas id="pizza-canvas" width="220" height="220"></canvas>
  </div>

  <!-- 분수 표현 -->
  <div class="fraction-display">
    <div class="frac">
      <div class="frac-num-wrap">
        <span class="frac-num" id="disp-num">0</span>
      </div>
      <div class="frac-line"></div>
      <div class="frac-den-wrap">
        <span class="frac-den" id="disp-den">3</span>
      </div>
    </div>
    <span class="eq-sign">=</span>
    <div class="result-wrap">
      <span class="result-num" id="disp-res">?</span>
    </div>
  </div>

  <div class="msg" id="msg"></div>

  <div class="btn-row">
    <button id="btn-remove" onclick="removeSlice()">➖ 조각 빼기</button>
    <button id="btn-add"    onclick="addSlice()">➕ 조각 추가</button>
    <button id="btn-reset"  onclick="resetPizza()">🔄 다시</button>
  </div>

<script>
let count = 0;
let total = 3;

const canvas = document.getElementById('pizza-canvas');
const ctx    = canvas.getContext('2d');

const sliceColors = [
  '#e63946','#f4a261','#ffbe0b','#06d6a0','#118ab2',
  '#9b5de5','#f15bb5','#00bbf9','#fee440','#fb5607',
  '#ff006e','#8338ec'
];

function drawPizza() {
  const cx = 110, cy = 110, r = 100;
  ctx.clearRect(0, 0, 220, 220);

  // 크러스트
  ctx.beginPath();
  ctx.arc(cx, cy, r + 8, 0, Math.PI * 2);
  ctx.fillStyle = '#f4a261';
  ctx.fill();

  if (total === 1) {
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = count >= 1 ? sliceColors[0] : '#ddd';
    ctx.fill();
  } else {
    const step = (2 * Math.PI) / total;
    const off  = -Math.PI / 2;
    for (let i = 0; i < total; i++) {
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, off + step * i, off + step * (i + 1));
      ctx.closePath();
      ctx.fillStyle = i < count ? sliceColors[i % sliceColors.length] : '#ddd';
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  // 중심 흰 점
  ctx.beginPath();
  ctx.arc(cx, cy, 6, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  // ← ctx.fillText 없음: 피자 위에 숫자 없음
}

function flashAnim(el) {
  el.classList.remove('flash');
  void el.offsetWidth;
  el.classList.add('flash');
}

function updateUI() {
  const numEl = document.getElementById('disp-num');
  const resEl = document.getElementById('disp-res');
  const msgEl = document.getElementById('msg');

  numEl.textContent = count;
  document.getElementById('disp-den').textContent = total;
  document.getElementById('desc-total').textContent = total;

  // opacity flash: 위치 전혀 안 바뀜
  flashAnim(numEl);

  document.getElementById('btn-add').disabled    = (count >= total);
  document.getElementById('btn-remove').disabled = (count <= 0);

  if (count === total) {
    resEl.textContent = '1';
    resEl.className = 'result-num known';
    msgEl.innerHTML =
      '<span style="font-size:1.4rem">🎉</span>' +
      '<span class="msg-frac">' +
        '<span class="msg-frac-num">' + total + '</span>' +
        '<div class="msg-frac-line"></div>' +
        '<span class="msg-frac-den">' + total + '</span>' +
      '</span>' +
      '<span style="font-size:1.4rem;font-weight:900;color:#2e8c1a"> = 1 이에요!</span>';
  } else {
    resEl.textContent = '?';
    resEl.className = 'result-num';
    msgEl.innerHTML = '';
  }
}

function addSlice()    { if (count < total) { count++; drawPizza(); updateUI(); } }
function removeSlice() { if (count > 0)     { count--; drawPizza(); updateUI(); } }
function resetPizza()  { count = 0;           drawPizza(); updateUI(); }

document.getElementById('total-input').addEventListener('input', function () {
  let v = parseInt(this.value);
  if (isNaN(v) || v < 1) v = 1;
  if (v > 12) v = 12;
  this.value = v;
  total = v;
  count = 0;
  drawPizza();
  updateUI();
});

drawPizza();
updateUI();
</script>
</body>
</html>
