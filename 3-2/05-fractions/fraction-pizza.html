<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>분수 피자</title>
<link rel="stylesheet" href="../../shared/tamheom.css?v=22" />
<style>
  .pizza, .bar { display: block; margin: 6px auto; touch-action: manipulation; }
  .pizza { width: min(340px, 70vw); height: auto; }
  .bar { width: min(500px, 86vw); height: auto; }
  .back .pizza { width: 200px; }
  .slice { cursor: pointer; transition: fill 0.15s; }
  .slice-num { font-size: 15px; font-weight: 800; fill: #6b5a45; pointer-events: none; }
  .count-line { font-size: 1.15rem; color: var(--ink-soft); text-align: center; min-height: 1.6em; }
  .explore-row { display: flex; gap: 12px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
  .explore { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center; }
  @media (max-width: 760px) { .explore { grid-template-columns: 1fr; } }
  .pz-q { font-size: 1.9rem; white-space: nowrap; text-align: center; margin: 6px 0 8px; }
  .pz-q .th-frac-inline, .pz-q .th-mini-frac { vertical-align: middle; }
  .color-side { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .color-side .th-check { width: 308px; height: 88px; font-size: 1.9rem; }
  .color-side .th-btn-quiet { font-size: 1.2rem; }
  .th-answer-col .th-bottom-play { display: none; }
  .th-play .th-cols { grid-template-columns: minmax(0, 1.3fr) minmax(450px, 1fr); }
  .big-frac { font-size: 2.4rem; font-weight: 900; color: var(--accent); text-align: center; }
  /* 아이폰 세로 */
  .th-narrow .pz-q { white-space: normal; font-size: 1.4rem; }
  .th-narrow .color-side .th-check { width: min(300px, 100%); height: 68px; font-size: 1.5rem; }
</style>
</head>
<body>
<script src="../../shared/tamheom.js?v=22"></script>
<script>
(function () {
  const T = Tamheom;
  const { randInt, pick, h, fracHTML } = T;
  const SVGNS = 'http://www.w3.org/2000/svg';
  const ON = '#f4a261', OFF = '#eeeae4', CRUST = '#d9a066';

  function svg(tag, attrs) {
    const e = document.createElementNS(SVGNS, tag);
    Object.entries(attrs || {}).forEach(([k, v]) => e.setAttribute(k, v));
    return e;
  }

  // 피자: n조각, filled 배열(true/false). onTap(i)이 있으면 조각을 눌러 칠할 수 있음
  function drawPizza(n, filled, opts) {
    opts = opts || {};
    const s = svg('svg', { viewBox: '0 0 240 240', class: 'pizza', role: 'img', 'aria-label': `피자 ${n}조각` });
    const cx = 120, cy = 120, r = 104;
    s.appendChild(svg('circle', { cx, cy, r: r + 9, fill: CRUST }));
    const parts = [];
    for (let i = 0; i < n; i++) {
      let el;
      if (n === 1) el = svg('circle', { cx, cy, r });
      else {
        const a0 = -Math.PI / 2 + (2 * Math.PI * i) / n;
        const a1 = -Math.PI / 2 + (2 * Math.PI * (i + 1)) / n;
        const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
        const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
        const large = a1 - a0 > Math.PI ? 1 : 0;
        el = svg('path', { d: `M${cx},${cy} L${x0},${y0} A${r},${r} 0 ${large} 1 ${x1},${y1} Z` });
      }
      el.setAttribute('fill', filled[i] ? ON : OFF);
      el.setAttribute('stroke', '#fff');
      el.setAttribute('stroke-width', '3');
      el.classList.add('slice');
      if (opts.onTap) el.addEventListener('click', () => opts.onTap(i));
      s.appendChild(el);
      parts.push(el);
      if (opts.numbers) {
        const am = -Math.PI / 2 + (2 * Math.PI * (i + 0.5)) / n;
        const t = svg('text', { x: cx + r * 0.62 * Math.cos(am), y: cy + r * 0.62 * Math.sin(am) + 5, 'text-anchor': 'middle', class: 'slice-num' });
        t.textContent = i + 1;
        s.appendChild(t);
      }
    }
    return { el: s, parts };
  }

  // 막대: n칸
  function drawBar(n, filled, opts) {
    opts = opts || {};
    const W = 440, H = 90;
    const s = svg('svg', { viewBox: `0 0 ${W + 8} ${H + 8}`, class: 'bar', role: 'img', 'aria-label': `막대 ${n}칸` });
    const w = W / n;
    const parts = [];
    for (let i = 0; i < n; i++) {
      const rect = svg('rect', { x: 4 + i * w, y: 4, width: w, height: H, fill: filled[i] ? ON : OFF, stroke: '#8a7a66', 'stroke-width': 2.5 });
      rect.classList.add('slice');
      if (opts.onTap) rect.addEventListener('click', () => opts.onTap(i));
      s.appendChild(rect);
      parts.push(rect);
      if (opts.numbers) {
        const t = svg('text', { x: 4 + i * w + w / 2, y: H / 2 + 10, 'text-anchor': 'middle', class: 'slice-num' });
        t.textContent = i + 1;
        s.appendChild(t);
      }
    }
    return { el: s, parts };
  }

  const fillArr = (n, m) => Array.from({ length: n }, (_, i) => i < m);

  function makeProblem(level) {
    if (level === 1) { const n = randInt(2, 8); return { k: 'color', shape: 'pizza', n, m: randInt(1, n - 1) }; }
    if (level === 2) { const n = randInt(2, 10); return { k: 'read', shape: 'pizza', n, m: randInt(1, n - 1) }; }
    const n = randInt(3, 12);
    return { k: pick(['read', 'read', 'color']), shape: 'bar', n, m: randInt(1, n - 1) };
  }

  T.activity({
    id: 'fraction-pizza',
    title: '분수 피자',
    emoji: '🍕',
    subtitle: '피자와 막대를 나눠서 분수를 알아봐요',
    accent: '#c2620f',
    accentSoft: '#fdf0e3',
    oneLineTop: true,
    toast: true,
    levels: [
      { name: '피자 색칠하기',       desc: '분수만큼 피자 조각을 눌러 색칠해요.' },
      { name: '피자 보고 분수 쓰기', desc: '① 모두 몇 조각 ② 색칠한 조각을 세고 분수로 써요.' },
      { name: '막대로 분수',         desc: '피자 대신 막대로. 답만 써요. 틀리면 풀이 단계와 피자 그림이 나와요.' }
    ],

    intro(el) {
      const wrap = h('div', 'explore');
      const n = 4;
      let m = 1;
      const picBox = h('div');
      const side = h('div');
      side.innerHTML = `<p>피자를 <b>똑같이 ${n}조각</b>으로 나눴어요.<br>칠한 조각 수가 <b>위</b>, 전체 조각 수가 <b>아래</b>에 가요.</p>`;
      const fr = h('div', 'big-frac');
      const row = h('div', 'explore-row');
      const minus = h('button', 'th-btn th-btn-quiet', '➖ 빼기');
      const plus = h('button', 'th-btn th-btn-primary', '➕ 칠하기');
      row.appendChild(minus); row.appendChild(plus);
      side.appendChild(fr); side.appendChild(row);
      function paint() {
        picBox.innerHTML = '';
        picBox.appendChild(drawPizza(n, fillArr(n, m)).el);
        fr.innerHTML = `${fracHTML(m, n)} <span style="font-size:1.1rem;color:var(--ink-soft)">(${n}조각 중 ${m}조각)</span>`;
      }
      plus.addEventListener('click', () => { if (m < n) { m++; paint(); } });
      minus.addEventListener('click', () => { if (m > 0) { m--; paint(); } });
      paint();
      wrap.appendChild(picBox); wrap.appendChild(side);
      el.appendChild(wrap);
    },

    question(el, ctx) {
      const p = ctx.review || makeProblem(ctx.level);
      ctx.setData(p);
      const shapeName = p.shape === 'pizza' ? '피자' : '막대';
      const unit = p.shape === 'pizza' ? '조각' : '칸';
      const draw = (filled, opts) => (p.shape === 'pizza' ? drawPizza : drawBar)(p.n, filled, opts);

      const cols = h('div', 'th-cols');
      const left = h('div', 'th-visual');
      const right = h('div', 'th-answer-col');
      cols.appendChild(left); cols.appendChild(right);
      el.appendChild(cols);

      const qText = h('div', 'th-question pz-q');
      const pic = h('div');
      const count = h('div', 'count-line');
      const hint = h('div', 'th-hint');
      hint.hidden = true;
      const back = h('div', 'back');   // 막대에서 틀리면 피자 그림
      left.appendChild(qText); left.appendChild(pic); left.appendChild(count); left.appendChild(hint); left.appendChild(back);

      function showPizzaBack(filled) {
        if (p.shape !== 'bar') return;
        back.innerHTML = '<p class="count-line">피자로 보면 이렇게 돼요</p>';
        back.appendChild(drawPizza(p.n, filled || fillArr(p.n, p.m), { numbers: true }).el);
      }

      if (p.k === 'color') {
        // 색칠하기
        qText.innerHTML = `${shapeName}의 ${fracHTML(p.m, p.n)}만큼 색칠해 보세요`;
        const filled = fillArr(p.n, 0);
        let numbers = false;
        function paint() {
          pic.innerHTML = '';
          pic.appendChild(draw(filled, { onTap: i => { filled[i] = !filled[i]; paint(); }, numbers }).el);
          const k = filled.filter(Boolean).length;
          count.textContent = `칠한 ${unit}: ${k}개`;
        }
        paint();
        hint.innerHTML = `분모 <b>${T.josa(p.n, '은', '는')}</b> 전체 ${unit} 수, 분자 <b>${T.josa(p.m, '은', '는')}</b> 칠할 ${unit} 수예요.<br>${p.m}${unit}을 눌러서 칠해요.`;
        if (ctx.level === 1) hint.hidden = false; else ctx.later(() => { hint.hidden = false; });

        const side = h('div', 'color-side');
        side.appendChild(h('p', 'count-line', `${unit}을 눌러서 칠하고<br>다 했으면 확인을 눌러요`));
        const done = h('button', 'th-btn th-btn-primary th-check th-key-check', '확인'); // 맞히면 그 자리에서 '다음 ▶'
        const reset = h('button', 'th-btn th-btn-quiet', '🔄 모두 지우기');
        side.appendChild(done); side.appendChild(reset);
        right.appendChild(side);
        reset.addEventListener('click', () => { filled.fill(false); paint(); });
        done.addEventListener('click', () => {
          const k = filled.filter(Boolean).length;
          if (k === p.m) {
            reset.disabled = true;
            ctx.correct(`${unit} 수를 잘 셌어!`);
          } else {
            const n = ctx.wrong(`지금 ${k}${unit} 칠했어. ${p.m}${unit}을 칠해 보자`);
            hint.hidden = false;
            if (n >= 2) { numbers = true; paint(); showPizzaBack(fillArr(p.n, p.m)); }
          }
        });
        return;
      }

      // 분수 쓰기: [①② 박스] 옆에 분수 칸 (분자=② 줄, 분모=① 줄). 분모부터, 아이가 직접 씀.
      qText.innerHTML = `색칠한 부분은 전체의 몇분의 몇일까요?`;
      pic.appendChild(draw(fillArr(p.n, p.m)).el);
      hint.innerHTML = `${shapeName}는 모두 <b>${p.n}${unit}</b>, 색칠한 것은 <b>${p.m}${unit}</b>이에요.`;
      if (ctx.level === 3) ctx.later(() => { hint.hidden = false; });

      const DEN = t => `<span class="den-c">${t}</span>`, NUM = t => `<span class="num-c">${t}</span>`;
      const sm = cls => { const s = T.slot({ small: true, label: '숫자 칸' }); s.el.classList.add(cls); return s; };
      const a = sm('den-s'), b = sm('num-s'), fn = sm('num-s'), fd = sm('den-s');
      const steps = [
        { label: `① ${DEN('모두 몇 ' + unit + '?')}`, slot: a, slots: [a], ok: () => a.number === p.n,
          why: () => a.number === p.m ? `색칠한 것만 말고 <b>모든</b> ${unit}을 세어 보자` : '',
          help: `${shapeName}는 모두 ${p.n}${unit}` },
        { label: `② ${NUM('색칠한 ' + unit + '?')}`, slot: b, slots: [b], ok: () => b.number === p.m,
          why: () => b.number === p.n ? `전체 말고 <b>색칠한</b> ${unit}만 세어 보자` : '',
          help: `색칠한 것은 ${p.m}${unit}` },
        { slots: [fd, fn], ok: () => fn.number === p.m && fd.number === p.n,
          why: () => (fn.number === p.n && fd.number === p.m) ? '위아래가 바뀌었어. 색칠한 수는 위, 전체 수는 아래에 써 보자' : '',
          help: `${DEN('전체 ' + p.n + unit)}은 아래, ${NUM('색칠한 ' + p.m + unit)}은 위` }
      ];
      const stepsBox = h('div', 'frac-steps');
      const qbox = h('div', 'fs-box');
      [steps[1], steps[0]].forEach((st, i) => {
        const row = h('div', 'fs-row');
        row.appendChild(h('span', 'fs-label', st.label));
        row.appendChild(st.slot.el);
        row.appendChild(h('span', 'fs-unit', unit));
        st.box = row;
        if (i === 1) qbox.appendChild(h('div', 'fs-gap'));
        qbox.appendChild(row);
      });
      stepsBox.appendChild(h('div', 'fs-head', '전체의 몇분의 몇?'));
      stepsBox.appendChild(qbox);
      const fr = h('div', 'fs-frac');
      fr.appendChild(fn.el); fr.appendChild(h('div', 'fs-line')); fr.appendChild(fd.el);
      stepsBox.appendChild(fr);
      steps[2].box = fr;
      const help = h('div', 'step-help fs-help');
      stepsBox.appendChild(help);
      steps.forEach(st => { st.wrongs = 0; });
      right.appendChild(stepsBox);

      const pad = T.keypad({ slots: [], onCheck: check, checkInPad: true });
      right.appendChild(pad.el);

      let mode = ctx.level === 3 ? 'direct' : 'steps', cur = 0;
      function focusStep() {
        steps.forEach((st, i) => { st.box.classList.toggle('is-now', i === cur); st.box.classList.toggle('is-done', i < cur); });
        pad.setSlots(steps[cur].slots);
      }
      if (mode === 'steps') focusStep();
      else {
        // 바로 답: 박스는 숨기고 분수 칸만
        qbox.style.visibility = 'hidden';
        fr.classList.add('is-now');
        pad.setSlots([fd, fn]);
      }

      function check() {
        if (mode === 'direct') {
          if (fn.value === '' || fd.value === '') { ctx.say('빈칸에 숫자를 써 보자', 'info'); return; }
          if (fn.number === p.m && fd.number === p.n) {
            [fn, fd].forEach(s => { s.mark('right'); s.lock(); });
            ctx.correct('분자와 분모를 잘 썼어!');
            return;
          }
          const why = steps[2].why();
          [fn, fd].forEach(s => { s.mark('wrong'); s.clear(); s.mark(null); });
          ctx.wrong((why ? why + '. ' : '괜찮아, ') + '하나씩 세어 보자');
          mode = 'steps'; cur = 0;
          qbox.style.visibility = '';
          fr.classList.remove('is-now');
          hint.hidden = false;
          showPizzaBack();
          focusStep();
          return;
        }
        const st = steps[cur];
        if (st.slots.some(s => s.value === '')) { ctx.say('빈칸에 숫자를 써 보자', 'info'); return; }
        if (st.ok()) {
          st.slots.forEach(s => { s.mark('right'); s.lock(); });
          help.innerHTML = '';
          if (cur < steps.length - 1) { cur += 1; focusStep(); }
          else {
            steps.forEach(x => { x.box.classList.remove('is-now'); x.box.classList.add('is-done'); });
            ctx.correct('분자와 분모를 잘 썼어!');
          }
          return;
        }
        st.slots.forEach(s => s.mark('wrong'));
        st.wrongs += 1;
        const why = st.why();
        const n = ctx.wrong(why || undefined);
        if (st.wrongs >= 2) {
          help.innerHTML = '도움: ' + st.help;
          pic.innerHTML = '';
          pic.appendChild(draw(fillArr(p.n, p.m), { numbers: true }).el);
        }
        pad.setSlots(st.slots);
      }
    }
  });
})();
</script>
</body>
</html>
