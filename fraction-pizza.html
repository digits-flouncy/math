<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>분수 피자</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Nanum Gothic', sans-serif; text-align: center; padding: 24px; background: #fffaf0; min-height: 100vh; }

  h1 { color: #e85d04; font-size: 2rem; margin-bottom: 8px; }

  .setting-area {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #fff3e0;
    border: 2px solid #f4a261;
    border-radius: 16px;
    padding: 10px 20px;
    margin: 12px 0 4px;
    font-size: 1.05rem;
    font-weight: bold;
  }
  .setting-area label { color: #c35a00; }
  .setting-area input[type="number"] {
    width: 64px;
    font-size: 1.1rem;
    font-weight: bold;
    text-align: center;
    border: 2px solid #f4a261;
    border-radius: 10px;
    padding: 4px 6px;
    background: #fff;
    color: #c35a00;
    outline: none;
  }
  .setting-area input[type="number"]:focus { border-color: #e85d04; }

  .desc {
    font-size: 1.1rem;
    color: #555;
    margin: 10px 0 4px;
    min-height: 1.6em;
  }
  .desc span { color: #e85d04; font-weight: bold; }

  .pizza-wrap {
    width: 220px;
    height: 220px;
    margin: 16px auto;
    position: relative;
  }
  .pizza-wrap canvas { border-radius: 50%; }

  .fraction {
    font-size: 3rem;
    font-weight: bold;
    margin: 12px 0;
    color: #333;
    letter-spacing: 2px;
    min-height: 1.2em;
  }
  .fraction .num   { color: #e85d04; }
  .fraction .denom { color: #1566b8; }
  .fraction .eq    { color: #555; }
  .fraction .res   { color: #2e8c1a; transition: color 0.3s; }
  .fraction .res.unknown { color: #aaa; }

  .msg {
    font-size: 1.4rem;
    font-weight: bold;
    color: #2e8c1a;
    min-height: 2rem;
    margin-bottom: 12px;
  }

  .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  button {
    font-size: 1.05rem;
    font-weight: bold;
    padding: 12px 22px;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.2s;
  }
  button:active { transform: scale(0.95); }
  #btn-add  { background: #e85d04; color: white; }
  #btn-add:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  #btn-reset { background: #888; color: white; }
</style>
</head>
<body>

  <h1>🍕 분수 탐험</h1>

  <!-- 조각 수 설정 -->
  <div class="setting-area">
    <label for="total-input">전체 조각 수:</label>
    <input type="number" id="total-input" min="1" max="12" value="3" />
    <span style="color:#888;font-size:0.9rem">조각</span>
  </div>

  <p class="desc" id="desc-text">
    피자를 <span id="desc-total">3</span>조각으로 나눴어요. 버튼을 눌러 조각을 채워 보세요!
  </p>

  <!-- 피자 캔버스 -->
  <div class="pizza-wrap">
    <canvas id="pizza-canvas" width="220" height="220"></canvas>
  </div>

  <!-- 분수 표시 -->
  <div class="fraction">
    <span class="num" id="disp-num">0</span>
    <span class="eq">/</span>
    <span class="denom" id="disp-den">3</span>
    <span class="eq"> = </span>
    <span class="res unknown" id="disp-res">?</span>
  </div>

  <div class="msg" id="msg"></div>

  <div class="btn-row">
    <button id="btn-add"   onclick="addSlice()">🍕 조각 추가</button>
    <button id="btn-reset" onclick="resetPizza()">🔄 다시</button>
  </div>

<script>
let count = 0;
let total = 3;

const canvas = document.getElementById('pizza-canvas');
const ctx = canvas.getContext('2d');
const sliceColors = [
  '#e63946','#f4a261','#ffbe0b','#06d6a0','#118ab2',
  '#9b5de5','#f15bb5','#00bbf9','#fee440','#fb5607',
  '#ff006e','#8338ec'
];

function drawPizza() {
  const cx = 110, cy = 110, r = 100;
  ctx.clearRect(0, 0, 220, 220);

  // crust
  ctx.beginPath();
  ctx.arc(cx, cy, r + 8, 0, Math.PI * 2);
  ctx.fillStyle = '#f4a261';
  ctx.fill();

  if (total === 1) {
    // full circle
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = count >= 1 ? sliceColors[0] : '#ddd';
    ctx.fill();
  } else {
    const anglePerSlice = (2 * Math.PI) / total;
    const startOffset = -Math.PI / 2;

    for (let i = 0; i < total; i++) {
      const startAngle = startOffset + anglePerSlice * i;
      const endAngle   = startOffset + anglePerSlice * (i + 1);
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, startAngle, endAngle);
      ctx.closePath();
      ctx.fillStyle = i < count ? sliceColors[i % sliceColors.length] : '#ddd';
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  // center dot
  ctx.beginPath();
  ctx.arc(cx, cy, 6, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();
}

function updateUI() {
  document.getElementById('disp-num').textContent = count;
  document.getElementById('disp-den').textContent = total;
  document.getElementById('desc-total').textContent = total;

  const resEl = document.getElementById('disp-res');
  const msgEl = document.getElementById('msg');

  if (count === total) {
    resEl.textContent = '1';
    resEl.className = 'res';
    msgEl.textContent = '🎉 ' + total + '/' + total + ' = 1 이에요!';
    document.getElementById('btn-add').disabled = true;
  } else {
    resEl.textContent = '?';
    resEl.className = 'res unknown';
    msgEl.textContent = '';
    document.getElementById('btn-add').disabled = false;
  }
}

function addSlice() {
  if (count < total) {
    count++;
    drawPizza();
    updateUI();
  }
}

function resetPizza() {
  count = 0;
  drawPizza();
  updateUI();
}

// 조각 수 입력 처리
document.getElementById('total-input').addEventListener('input', function () {
  let val = parseInt(this.value);
  if (isNaN(val) || val < 1) val = 1;
  if (val > 12) val = 12;
  this.value = val;
  total = val;
  count = 0;
  drawPizza();
  updateUI();
});

// 초기 렌더
drawPizza();
updateUI();
</script>
</body>
</html>
