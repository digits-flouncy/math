<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>수학 탐험대 🧮</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nanum Gothic', sans-serif;
    background: #f0f7ff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    color: #222;
  }

  h1 {
    font-size: 2.2rem;
    font-weight: 900;
    color: #d45f00;
    margin-bottom: 8px;
    text-align: center;
  }
  .subtitle {
    font-size: 1rem;
    color: #888;
    margin-bottom: 40px;
    text-align: center;
  }

  .card-list {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .card {
    background: #fff;
    border-radius: 24px;
    padding: 32px 28px;
    width: 220px;
    text-align: center;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 6px 20px rgba(0,0,0,0.10);
    border: 3px solid transparent;
    transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 32px rgba(0,0,0,0.15);
  }

  .card-pizza  { border-color: #f4a261; }
  .card-animal { border-color: #6aabdf; }
  .card-frog   { border-color: #7fb88a; }
  .card-pizza:hover  { border-color: #e85d04; }
  .card-animal:hover { border-color: #1a6fa8; }
  .card-frog:hover   { border-color: #3a7d5c; }

  .card-emoji { font-size: 3.5rem; line-height: 1; }

  .card-title {
    font-size: 1.15rem;
    font-weight: 900;
    color: #222;
  }
  .card-pizza  .card-title { color: #c35a00; }
  .card-animal .card-title { color: #1a6fa8; }
  .card-frog   .card-title { color: #3a7d5c; }

  .card-desc {
    font-size: 0.85rem;
    color: #888;
    line-height: 1.5;
  }

  .card-badge {
    font-size: 0.75rem;
    font-weight: 900;
    padding: 4px 12px;
    border-radius: 99px;
    margin-top: 4px;
  }
  .card-pizza  .card-badge { background: #fff3e0; color: #c35a00; }
  .card-animal .card-badge { background: #e8f4ff; color: #1a6fa8; }
  .card-frog   .card-badge { background: #eef6ef; color: #3a7d5c; }
</style>
</head>
<body>

<h1>🧮 수학 탐험대</h1>
<p class="subtitle">배우고 싶은 문제를 골라봐요!</p>

<div class="card-list">

  <a class="card card-pizza" href="activities/fractions/fraction-pizza.html">
    <div class="card-emoji">🍕</div>
    <div class="card-title">분수 탐험</div>
    <div class="card-desc">피자를 나눠 먹으며<br>분수를 배워요!</div>
    <div class="card-badge">초3 · 분수</div>
  </a>

  <a class="card card-animal" href="activities/multiplication/animal-legs.html">
    <div class="card-emoji">🐷🦆</div>
    <div class="card-title">다리가 몇 개?</div>
    <div class="card-desc">돼지와 오리의 다리 수로<br>마리 수를 맞혀요!</div>
    <div class="card-badge">초3 · 곱셈·나눗셈</div>
  </a>

  <a class="card card-frog" href="activities/fractions/fraction-part-whole.html">
    <div class="card-emoji">🐸</div>
    <div class="card-title">개구리 묶음 분수</div>
    <div class="card-desc">개구리를 묶어서<br>몇분의 몇인지 알아봐요!</div>
    <div class="card-badge">초3 · 분수</div>
  </a>

</div>

</body>
</html>
