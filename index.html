<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>수학 탐험대 🧮</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Nanum Gothic', -apple-system, sans-serif;
    background: #f0f7ff;
    color: #222;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #app { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 20px; }
  .wrap { display: flex; flex-direction: column; align-items: center; }

  .bar { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; min-height: 64px; }
  .back {
    width: 64px; height: 64px; border-radius: 18px; border: 2px solid #d6e4f2; background: #fff;
    font-size: 1.8rem; cursor: pointer; flex: none; box-shadow: 0 3px 10px rgba(0,0,0,.06);
  }
  h1 { font-size: 2.2rem; font-weight: 900; color: #d45f00; text-align: center; white-space: nowrap; }
  .subtitle { font-size: 1.15rem; color: #888; margin-bottom: 28px; text-align: center; }

  .grid { display: grid; gap: 20px; justify-content: center; }
  .grid.sem { grid-template-columns: repeat(2, 280px); }
  .grid.units { grid-template-columns: repeat(3, 250px); }
  .grid.acts { grid-template-columns: repeat(var(--n, 3), 240px); }

  .tile {
    background: #fff; border-radius: 24px; padding: 26px 20px; text-align: center; text-decoration: none; color: inherit;
    box-shadow: 0 6px 20px rgba(0,0,0,0.10); border: 3px solid var(--c, #cfe0f0);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    cursor: pointer; font: inherit; transition: transform .15s;
  }
  .tile:active { transform: scale(.97); }
  .tile-emoji { font-size: 3.2rem; line-height: 1; }
  .tile-big { font-size: 2.6rem; font-weight: 900; color: var(--c2, #1a6fa8); line-height: 1.1; }
  .tile-title { font-size: 1.35rem; font-weight: 900; color: var(--c2, #222); }
  .tile-desc { font-size: 0.95rem; color: #888; line-height: 1.5; }
  .tile-text { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .tile-badge { font-size: 0.85rem; font-weight: 900; padding: 4px 12px; border-radius: 99px; background: var(--c3, #eef4fa); color: var(--c2, #1a6fa8); }
  .units .tile { min-height: 170px; padding: 20px 14px; }
  .unit-no { width: 48px; height: 48px; border-radius: 50%; background: var(--c2, #1a6fa8); color: #fff; font-size: 1.5rem; font-weight: 900; display: flex; align-items: center; justify-content: center; }
  /* 활동이 없는 단원: 회색 대신 연하게 */
  .tile.is-empty { opacity: .45; box-shadow: none; cursor: default; }
  .tile.is-empty .tile-badge { background: #f1f1f1; color: #999; }
  /* 아이폰 세로(폭 700 이하): 한 줄에 하나씩 크게, 위아래 스크롤 허용 */
  @media (max-width: 700px) {
    body { overflow: auto; }
    #app { justify-content: flex-start; padding: 16px 14px 28px; }
    .wrap { width: 100%; max-width: 420px; }
    h1 { font-size: 1.7rem; white-space: normal; }
    .back { width: 52px; height: 52px; font-size: 1.5rem; }
    .subtitle { margin-bottom: 18px; }
    .grid { width: 100%; gap: 14px; }
    .grid.sem { grid-template-columns: 1fr; }
    .grid.units { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .units .tile { min-height: 140px; }
    .grid.acts { grid-template-columns: 1fr; }
    .acts .tile { flex-direction: row; justify-content: flex-start; text-align: left; padding: 14px 18px; gap: 16px; }
    .acts .tile-emoji { font-size: 2.6rem; flex: none; }
    .acts .tile-text { align-items: flex-start; gap: 4px; min-width: 0; }
  }
  /* 아이폰 가로(높이 500 이하): 위아래 스크롤 허용 */
  @media (max-height: 500px) and (min-width: 701px) {
    body { overflow: auto; }
    #app { justify-content: flex-start; }
  }
</style>
</head>
<body>
<div id="app"><div class="wrap" id="wrap"></div></div>

<script>
  // 학기 → 단원 → 활동. 주소 끝(#3-2, #3-2/5)으로 위치를 기억해서 뒤로 가기도 됨.
  const COURSES = [
    { id: '3-2', title: '3학년 2학기', emoji: '🐸', c: '#7fb88a', c2: '#3a7d5c', c3: '#eef6ef', units: [
      { no: 1, name: '곱셈', emoji: '✖️', acts: [
        { href: '3-2/01-multiplication/animal-legs.html', emoji: '🐷🦆', title: '다리가 몇 개?', desc: '돼지와 오리의 다리 수로<br>마리 수를 맞혀요!', c: '#6aabdf', c2: '#1a6fa8', c3: '#e8f4ff' }
      ] },
      { no: 2, name: '나눗셈', emoji: '➗', acts: [] },
      { no: 3, name: '원', emoji: '⭕', acts: [] },
      { no: 4, name: '들이와 무게', emoji: '⚖️', acts: [
        { href: '3-2/04-capacity-weight/measure.html?t=convert', emoji: '🔁', title: '단위 바꾸기', desc: 'L와 mL, kg과 g,<br>t과 kg을 바꿔요!', c: '#6aabdf', c2: '#1a6fa8', c3: '#e8f4ff' },
        { href: '3-2/04-capacity-weight/measure.html?t=calc', emoji: '➕', title: '들이와 무게 계산', desc: '단위끼리 더하고<br>빼요!', c: '#7fb88a', c2: '#3a7d5c', c3: '#eef6ef' },
        { href: '3-2/04-capacity-weight/measure.html?t=unit', emoji: '⚖️', title: '알맞은 단위', desc: '물건에 맞는 단위를<br>골라요!', c: '#f4a261', c2: '#c35a00', c3: '#fff3e0' }
      ] },
      { no: 5, name: '분수', emoji: '🍕', acts: [
        { href: '3-2/05-fractions/fraction-pizza.html', emoji: '🍕', title: '분수 피자', desc: '피자를 나눠 먹으며<br>분수를 배워요!', c: '#f4a261', c2: '#c35a00', c3: '#fff3e0' },
        { href: '3-2/05-fractions/fraction-part-whole.html', emoji: '🐸', title: '개구리 묶음 분수', desc: '개구리를 묶어서<br>몇분의 몇인지 알아봐요!', c: '#7fb88a', c2: '#3a7d5c', c3: '#eef6ef' },
        { href: '3-2/05-fractions/fraction-more.html?t=length', emoji: '📏', title: '분수만큼의 길이', desc: '자를 보고 리본의<br>분수만큼 길이를 구해요!', c: '#6aabdf', c2: '#1a6fa8', c3: '#e8f4ff' },
        { href: '3-2/05-fractions/fraction-more.html?t=kinds', emoji: '🧩', title: '가분수와 대분수', desc: '가분수는 대분수로,<br>대분수는 가분수로!', c: '#b89ad8', c2: '#6a43a0', c3: '#f3ecfb' },
        { href: '3-2/05-fractions/fraction-more.html?t=compare', emoji: '⚖️', title: '분수 크기 비교', desc: '>, =, < 로<br>분수의 크기를 비교해요!', c: '#f4a261', c2: '#c35a00', c3: '#fff3e0' }
      ] },
      { no: 6, name: '그림그래프', emoji: '📊', acts: [
        { href: '3-2/06-picture-graphs/picture-graph.html?t=read', emoji: '🔍', title: '그림그래프 읽기', desc: '큰 그림·작은 그림을 세어<br>수를 읽어요!', c: '#7fb88a', c2: '#3a7d5c', c3: '#eef6ef' },
        { href: '3-2/06-picture-graphs/picture-graph.html?t=make', emoji: '✏️', title: '그림그래프 그리기', desc: '표의 수를 보고<br>그림으로 나타내요!', c: '#6aabdf', c2: '#1a6fa8', c3: '#e8f4ff' },
        { href: '3-2/06-picture-graphs/picture-graph.html?t=use', emoji: '📊', title: '그래프 해석하기', desc: '가장 많은 곳, 차이,<br>모두를 알아봐요!', c: '#f4a261', c2: '#c35a00', c3: '#fff3e0' }
      ] }
    ] },
    { id: '4-1', title: '4학년 1학기', emoji: '🚀', c: '#9fb7e6', c2: '#2f5fb3', c3: '#eaf0fb', units: [
      { no: 1, name: '각도', emoji: '📐', acts: [] },
      { no: 2, name: '큰 수', emoji: '🔢', acts: [] },
      { no: 3, name: '평면도형의 이동', emoji: '🔄', acts: [] },
      { no: 4, name: '곱셈과 나눗셈', emoji: '🧮', acts: [] },
      { no: 5, name: '규칙 찾기', emoji: '🔍', acts: [] },
      { no: 6, name: '막대그래프', emoji: '📊', acts: [] }
    ] }
  ];

  const wrap = document.getElementById('wrap');
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const colors = (e, o) => { if (o.c) e.style.setProperty('--c', o.c); if (o.c2) e.style.setProperty('--c2', o.c2); if (o.c3) e.style.setProperty('--c3', o.c3); };

  function header(title, sub, backTo) {
    const bar = el('div', 'bar');
    if (backTo != null) {
      const b = el('button', 'back', '⬅️');
      b.type = 'button'; b.setAttribute('aria-label', '뒤로');
      b.addEventListener('click', () => { location.hash = backTo; });
      bar.appendChild(b);
    }
    bar.appendChild(el('h1', '', title));
    wrap.appendChild(bar);
    wrap.appendChild(el('p', 'subtitle', sub));
  }

  function render() {
    const [cid, uno] = location.hash.replace('#', '').split('/');
    const course = COURSES.find(c => c.id === cid);
    const unit = course && course.units.find(u => String(u.no) === uno && u.acts.length);
    wrap.innerHTML = '';

    if (!course) {
      header('🧮 수학 탐험대', '몇 학년 몇 학기를 공부할까요?', null);
      const g = el('div', 'grid sem');
      COURSES.forEach(c => {
        const t = el('a', 'tile');
        t.href = '#' + c.id;
        colors(t, c);
        const n = c.units.reduce((s, u) => s + u.acts.length, 0);
        t.innerHTML = `<div class="tile-emoji">${c.emoji}</div><div class="tile-big">${c.title}</div>` +
          `<div class="tile-badge">${n ? '활동 ' + n + '개' : '준비 중'}</div>`;
        g.appendChild(t);
      });
      wrap.appendChild(g);
    } else if (!unit) {
      header(course.title, '어떤 단원을 공부할까요?', '');
      const g = el('div', 'grid units');
      course.units.forEach(u => {
        const has = u.acts.length > 0;
        const t = el(has ? 'a' : 'div', 'tile' + (has ? '' : ' is-empty'));
        colors(t, course);
        if (has) t.href = `#${course.id}/${u.no}`;
        t.innerHTML = `<div class="unit-no">${u.no}</div><div class="tile-title">${u.emoji} ${u.name}</div>` +
          `<div class="tile-badge">${has ? '활동 ' + u.acts.length + '개' : '준비 중'}</div>`;
        g.appendChild(t);
      });
      wrap.appendChild(g);
    } else {
      header(`${unit.no}. ${unit.name}`, `${course.title} · 배우고 싶은 문제를 골라봐요!`, '#' + course.id);
      const g = el('div', 'grid acts');
      g.style.setProperty('--n', Math.min(3, unit.acts.length));
      unit.acts.forEach(a => {
        const t = el('a', 'tile');
        t.href = a.href;
        colors(t, a);
        t.innerHTML = `<div class="tile-emoji">${a.emoji}</div><div class="tile-text"><div class="tile-title">${a.title}</div><div class="tile-desc">${a.desc}</div></div>`;
        g.appendChild(t);
      });
      wrap.appendChild(g);
    }
    fit();
  }

  // 큰 화면(가로 아이패드 13인치 등)에서는 키우고, 작은 화면에서는 줄여서 스크롤 없이 한 화면에.
  function fit() {
    wrap.style.zoom = '1';
    // 아이폰(세로 폭 700 이하, 가로 높이 500 이하): 줄이지 않고 스크롤
    if (innerWidth <= 700 || innerHeight <= 500) return;
    const r = wrap.getBoundingClientRect();
    const z = Math.max(0.5, Math.min(1.6, (innerHeight - 48) / r.height, (innerWidth - 40) / r.width));
    wrap.style.zoom = String(Math.floor(z * 100) / 100);
  }

  addEventListener('hashchange', render);
  addEventListener('resize', fit);
  render();
</script>
</body>
</html>
